<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Best2026 Panel</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #ffffff;
}

.container {
    max-width: 1050px;
    margin: 40px auto;
    padding: 20px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    color: #81C784;
    letter-spacing: .3px;
}

.card {
    background: #2a2a2a;
    border: 1px solid #383838;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

.card h2 {
    margin-top: 0;
    color: #81C784;
}

.form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input,
select,
button {
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 8px;
}

input,
select {
    border: 1px solid #454545;
    background: #333333;
    color: #ffffff;
    outline: none;
}

input::placeholder {
    color: #999999;
}

input:focus,
select:focus {
    border-color: #4CAF50;
    box-shadow: 0 0 0 2px rgba(76,175,80,.15);
}

input {
    flex: 1;
    min-width: 180px;
}

select {
    min-width: 180px;
}

button {
    cursor: pointer;
    background: #333333;
    color: #ffffff;
    border: 1px solid #4a4a4a;
    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .1s ease;
}

button:hover {
    background: #66BB6A;
    border-color: #66BB6A;
    color: #121212;
}

button:active {
    transform: translateY(1px);
}

/* CREATE CLIENT */

.create-client-button {
    background: #4CAF50;
    color: #121212;
    border-color: #4CAF50;
    font-weight: bold;
}

.create-client-button:hover {
    background: #66BB6A;
    border-color: #66BB6A;
    color: #121212;
}

/* CLIENT */

.client {
    padding: 20px 0;
    border-bottom: 1px solid #3a3a3a;
}

.client:last-child {
    border-bottom: none;
}

.client-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
}

.client-info {
    min-width: 0;
    flex: 1;
}

.client-name-row {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
}

.status-dot {
    width: 10px;
    height: 10px;
    min-width: 10px;
    border-radius: 50%;
    background: #666666;
    box-shadow: 0 0 0 2px rgba(255,255,255,.05);
}

.status-dot.online {
    background: #4CAF50;
    box-shadow: 0 0 8px rgba(76,175,80,.65);
    animation: onlinePulse 1.5s ease-in-out infinite;
}

@keyframes onlinePulse {

    0%, 100% {
        opacity: .35;
        transform: scale(.9);
        box-shadow: 0 0 3px rgba(76,175,80,.25);
    }

    50% {
        opacity: 1;
        transform: scale(1.15);
        box-shadow: 0 0 10px rgba(76,175,80,.8);
    }

}

.client-name {
    font-weight: bold;
    font-size: 17px;
    color: #ffffff;
}

.online-label {
    color: #81C784 !important;
    font-size: 12px;
}

.protocol {
    margin-top: 5px;
    color: #ffffff;
    font-size: 14px;
}

/* TRAFFIC */

.traffic {
    margin-top: 14px;
}

.traffic-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 14px;
}

.traffic-used {
    font-weight: bold;
    color: #81C784;
}

.traffic-limit {
    color: #b0b0b0;
}

.progress {
    width: 100%;
    height: 9px;
    background: #3a3a3a;
    border-radius: 999px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #4CAF50;
    border-radius: 999px;
    transition: width .3s ease;
}

.progress-bar.full {
    background: #ef5350;
}

.unlimited {
    color: #999999;
    font-size: 13px;
    margin-top: 7px;
}

.disabled {
    color: #ef5350;
    font-weight: bold;
    font-size: 13px;
    margin-top: 7px;
}

.quota-status {
    display: none;
}

.quota-status.show {
    display: block;
}

/* ACTIONS */

.actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 430px;
}

.actions button {
    white-space: nowrap;
}

/* ENABLE / DISABLE */

.status-toggle {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 50px;
    height: 26px;
    padding: 0;
    border: 1px solid #555555;
    border-radius: 999px;
    background: #353535;
    cursor: pointer;
    transition:
        background .2s ease,
        border-color .2s ease;
}

.status-toggle .toggle-knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #777777;
    transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

.status-toggle.enabled {
    background: rgba(76,175,80,.22);
    border-color: #4CAF50;
}

.status-toggle.enabled .toggle-knob {
    transform: translateX(24px);
    background: #4CAF50;
    box-shadow: 0 0 9px rgba(76,175,80,.65);
}

.status-toggle.disabled {
    background: #292929;
    border-color: #4a4a4a;
}

.status-toggle.disabled .toggle-knob {
    transform: translateX(0);
    background: #666666;
    box-shadow: none;
}

.status-toggle:hover {
    background: rgba(76,175,80,.18);
    border-color: #66BB6A;
}

.status-toggle.disabled:hover {
    background: #353535;
}

.status-toggle:disabled {
    opacity: .65;
    cursor: not-allowed;
}

/* MORE */

.more-wrapper {
    position: relative;
}

.more-button {
    min-width: 74px;
    background: #333333;
    color: #ffffff;
}

.more-menu {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: #242424;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.more-menu.show {
    display: flex;
}

.more-menu button {
    background: #333333;
    color: #ffffff;
    border: 1px solid #454545;
}

.more-menu button:hover {
    background: #66BB6A;
    color: #121212;
    border-color: #66BB6A;
}

.more-menu .danger {
    color: #ef5350;
    border-color: #713b3b;
}

.more-menu .danger:hover {
    background: #ef5350;
    color: #121212;
    border-color: #ef5350;
}

.more-menu form {
    margin: 0;
}

.empty {
    color: #999999;
    text-align: center;
    padding: 30px 0;
}

.hint {
    color: #999999;
    font-size: 13px;
    margin-top: 8px;
}

/* QR MODAL */

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0,0,0,.72);
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(3px);
}

.modal.show {
    display: flex;
}

.modal-content {
    background: #2a2a2a;
    border: 1px solid #404040;
    border-radius: 14px;
    padding: 25px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.45);
}

.modal-content h3 {
    margin-top: 0;
    margin-bottom: 20px;
    color: #81C784;
}

#qrcode {
    display: flex;
    justify-content: center;
    align-items: center;

    width: 340px;
    height: 340px;

    max-width: 100%;
    max-height: 340px;

    margin: 15px auto 20px;

    padding: 10px;

    background: #ffffff;

    border-radius: 8px;

    overflow: hidden;
}

#qrcode img,
#qrcode canvas {
    display: block;

    width: 320px !important;
    height: 320px !important;

    max-width: 100%;
    max-height: 100%;

    image-rendering: pixelated;
}

/* QR CONFIG */

.qr-config {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    padding: 10px;

    background: #181818;
    color: #d1d5db;

    border: 1px solid #3f3f3f;
    border-radius: 8px;

    font-size: 12px;

    margin-bottom: 12px;

    outline: none;
}

.modal-actions {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.close-modal {
    background: #444444;
    color: #ffffff;
}

/* MOBILE */

@media (max-width: 700px) {

    .container {
        margin: 20px auto;
        padding: 14px;
    }

    .card {
        padding: 16px;
    }

    .client-top {
        flex-direction: column;
    }

    .actions {
        justify-content: flex-start;
        max-width: none;
        width: 100%;
    }

    .more-wrapper {
        width: 100%;
    }

    .more-menu {
        justify-content: flex-start;
    }

    #qrcode {
        width: 300px;
        height: 300px;
        padding: 8px;
    }

    #qrcode img,
    #qrcode canvas {
        width: 284px !important;
        height: 284px !important;
    }

}

</style>

</head>

<body>
